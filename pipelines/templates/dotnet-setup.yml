steps:
  - checkout: self
    fetchDepth: 1
  - task: UseDotNet@2
    displayName: .NET SDK from global.json
    inputs:
      packageType: sdk
      useGlobalJson: true
  - task: Cache@2
    displayName: Cache NuGet packages
    inputs:
      key: 'nuget | "$(Agent.OS)" | **/packages.lock.json,!**/bin/**,!**/obj/**'
      restoreKeys: |
        nuget | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.nuget/packages
  - script: dotnet tool restore && dotnet restore Qf.EhrPlatform.slnx
    displayName: Restore (locked mode)
    env:
      NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
